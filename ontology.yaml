metadata:
  name: FuelLoading_NP_Hardness_Ontology
  version: 1.1.0
  date: 2026-10-21
  author: ivan
  description: Онтология анализа и формализации доказательства NP-сложности задачи оптимизации схемы загрузки топлива ядерного реактора с внешними графами знаний.

goal:
  description: Формализация сущностей исследования, статей, математических моделей, утверждений об NP-сложности, шагов доказательства и интеграция с внешними базами знаний OpenAlex и Wikidata.

competency_questions:
  - id: CQ1
    text: В каких источниках заявляется об NP-сложности задачи оптимизации схемы перегрузки?
    expected_classes: [Источник, Утверждение]
    expected_properties: [содержитУтверждение, ссылаетсяНа]
  - id: CQ2
    text: Какие физические и теплотехнические ограничения накладываются на математическую модель реактора?
    expected_classes: [Модель, Ограничение]
    expected_properties: [накладываетОграничение]
  - id: CQ3
    text: Чем подтверждается или обосновывается заявленное утверждение о сложности задачи?
    expected_classes: [Утверждение, Доказательство]
    expected_properties: [обосновано, опровергает]
  - id: CQ4
    text: Какими проверками валидируются выполненные задачи агента в проекте?
    expected_classes: [Задача, Проверка]
    expected_properties: [проверенЧерез, решает]
  - id: CQ5
    text: Какими запросами к внешним графам знаний были найдены источники и кто их авторы?
    expected_classes: [Источник, Автор, ЗапросКГрафу]
    expected_properties: [найденЗапросом, написан]

classes:
  Сущность:
    parent: null
    definition: Базовый класс всех объектов и понятий проекта.

  Файл:
    parent: null
    definition: Файл проекта на диске (код, данные, статьи, отчеты).

  Задача:
    parent: null
    definition: Заметка задачи или подзадачи агента в папке tasks/.

  Источник:
    parent: Сущность
    definition: Опубликованная научная статья, препринт или рабочий документ с постановкой задачи или обзором.

  Автор:
    parent: Сущность
    definition: Ученый, исследователь или коллектив — автор опубликованной научной работы.

  ЗапросКГрафу:
    parent: Сущность
    definition: Обращение к внешнему графу знаний (OpenAlex, Wikidata) — источник, инструмент, параметры, дата и количество найденных записей.

  Модель:
    parent: Сущность
    definition: Математическая постановка задачи оптимизации перегрузки активной зоны (ВВЭР, PWR).

  Ограничение:
    parent: Сущность
    definition: Нейтронно-физическое, теплотехническое или геометрическое ограничение схемы загрузки.

  Утверждение:
    parent: Сущность
    definition: Тезис или гипотеза (в частности, о принадлежности задачи к классу NP-hard).

  Доказательство:
    parent: Сущность
    definition: Математическое сведение (редукция) или формальный вывод (в том числе на Lean 4).

  Проверка:
    parent: Сущность
    definition: Автоматический тест (скрипт pytest/python) или инвариант, подтверждающий решение.

properties:
  подзадачаОт:
    domain: Задача
    range: Задача
    characteristics: [asymmetric, irreflexive]
    inverse: имеетПодзадачу

  имеетПодзадачу:
    domain: Задача
    range: Задача
    inverse: подзадачаОт

  хранитсяВ:
    domain: Сущность
    range: Файл

  ссылаетсяНа:
    domain: Источник
    range: Источник

  цитирует:
    domain: Источник
    range: Источник
    inverse: цитируетсяВ

  цитируетсяВ:
    domain: Источник
    range: Источник
    inverse: цитирует

  содержитУтверждение:
    domain: Источник
    range: Утверждение
    inverse: выдвинутоВ

  выдвинутоВ:
    domain: Утверждение
    range: Источник
    inverse: содержитУтверждение

  найденЗапросом:
    domain: Источник
    range: ЗапросКГрафу
    inverse: нашелИсточник

  нашелИсточник:
    domain: ЗапросКГрафу
    range: Источник
    inverse: найденЗапросом

  написан:
    domain: Источник
    range: Автор
    inverse: являетсяАвтором

  являетсяАвтором:
    domain: Автор
    range: Источник
    inverse: написан

  накладываетОграничение:
    domain: Модель
    range: Ограничение

  относитсяКМодели:
    domain: Утверждение
    range: Модель

  обосновано:
    domain: Утверждение
    range: Доказательство
    inverse: доказывает

  доказывает:
    domain: Доказательство
    range: Утверждение
    inverse: обосновано

  опровергает:
    domain: Доказательство
    range: Утверждение

  опираетсяНаИсточник:
    domain: [Модель, Доказательство]
    range: Источник
    inverse: используетсяВ

  используетсяВ:
    domain: Источник
    range: [Модель, Доказательство]
    inverse: опираетсяНаИсточник

  проверенЧерез:
    domain: Задача
    range: Проверка

  решает:
    domain: [Проверка, Доказательство, ЗапросКГрафу]
    range: Задача

attributes:
  status:
    domain: Задача
    type: string
    values: [открыта, в работе, выполнена, заблокирована, принята]

  oa_status:
    domain: Источник
    type: string
    values: [diamond, gold, hybrid, green, bronze, closed]

rules:
  - id: R1
    text: каждое доказательство обосновывает хотя бы одно утверждение
    dl: Доказательство ⊑ ∃доказывает.Утверждение
    check: some

  - id: R2
    text: каждое утверждение об NP-сложности выдвинуто в некотором источнике
    dl: Утверждение ⊑ ∃выдвинутоВ.Источник
    check: some

  - id: R3
    text: выполненная задача — задача со статусом «выполнена» или «принята»
    dl: ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}
    check: defined_value

  - id: R4
    text: доказательство не может одновременно обосновывать и опровергать одно утверждение
    dl: DisjointObjectProperties(обосновано опровергает)
    check: disjoint_properties

  - id: R5
    text: каждый источник указывает запрос к внешнему графу знаний, которым он найден или сверен
    dl: Источник ⊑ ∃найденЗапросом.ЗапросКГрафу
    check: some

  - id: R6
    text: у каждого источника в графе записан хотя бы один автор
    dl: Источник ⊑ ∃написан.Автор
    check: some